<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="pagina">
        <div class="container1">
            <h1 class="titulo">Jogo da Memória</h1>
        </div>
        <div class="container2">
            <div class="timer">
                <div id="timer">00:00</div>
                <div class="botoes">
                    <button class="btn" id="start" onclick="iniciarTimer(); iniciarContagem();">Iniciar</button>
                    <button class="btn" id="reset" onclick="resetarTimer()">Resetar</button>
                </div>
            </div>
            <div class="container3">
                <div class="tabuleiro">
                    <div class="celula" onclick="clique(this)" id="c1"><img src="" alt="Imagem 1"></div>
                    <div class="celula" onclick="clique(this)" id="c2"><img src="img/img2.webp" alt="Imagem 2"></div>
                    <div class="celula" onclick="clique(this)" id="c3"><img src="img/img3.webp" alt="Imagem 3"></div>
                    <div class="celula" onclick="clique(this)" id="c4"><img src="img/img4.webp" alt="Imagem 4"></div>
                    <div class="celula" onclick="clique(this)" id="c5"><img src="img/img5.webp" alt="Imagem 5"></div>
                    <div class="celula" onclick="clique(this)" id="c6"><img src="img/img6.webp" alt="Imagem 6"></div>
                    <div class="celula" onclick="clique(this)" id="c7"><img src="img/img7.webp" alt="Imagem 7"></div>
                    <div class="celula" onclick="clique(this)" id="c8"><img src="img/img8.webp" alt="Imagem 8"></div>
                    <div class="celula" onclick="clique(this)" id="c9"><img src="img/img9.webp" alt="Imagem 9"></div>
                    <div class="celula" onclick="clique(this)" id="c10"><img src="img/img10.webp" alt="Imagem 10"></div>
                    <div class="celula" onclick="clique(this)" id="c11"><img src="img/img11.webp" alt="Imagem 11"></div>
                    <div class="celula" onclick="clique(this)" id="c12"><img src="img/img12.webp" alt="Imagem 12"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2>Jogo da memória Somos Filhos</h2>
            <p>Bem-vindo ao Jogo da Memória! O objetivo é encontrar os pares de cartas iguais. Clique em uma carta para revelá-la e tente lembrar onde estão as outras cartas</p>
            <p>Faça no menor tempo possível e fique dentro do rank</p>
            <p>Boa sorte e divirta-se jogando!</p>
            <button class="btnj btn" onclick="fecharModal(); resetarTimer();">Jogar</button>
        </div>
    </div>

    <div class="modalcontagem" id="modalcontage">
        <div class="modal-content">
            <div id="contador"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
